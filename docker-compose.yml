version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pricecompare-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pricecompare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Persistent data
      - pgdata:/var/lib/postgresql/data
      # Auto-run schema on first start
      - ./scraper/src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
